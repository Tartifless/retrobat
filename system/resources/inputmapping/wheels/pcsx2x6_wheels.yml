# This file is provided with RetroBat
# It can be used to automatically generate Mapping automatically for your wheel in PCSX2x6 (Arcade)
# Each container must be named with the wheel type internal to RetroBat (see our wiki for the list)
# The elements listed are the buttons that will be mapped in the emulator
# The key represents the INI key for the button
# The value represents the SDL/DInput code for the button
#
LogitechG29:
  wheeltype: 2
  driver: sdl
  name: Logitech G HUB G29 Driving Force Racing Wheel USB
  FFDevice: SDL
  SteerLeft: -Axis6
  SteerRight: +Axis6
  P1_Up: Hat0North
  P1_Down: Hat0South
  P1_Left: Hat0West
  P1_Right: Hat0East
  Gas: +Axis7~
  Brake: +Axis8~
  Gear3: Button35
