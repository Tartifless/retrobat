  BG3_Hazard_P1: Button23
  Racing_View_P1: Button24
  BG3_View_P1: Button24
  BG3_Sidebrake_P1: Button22
  Racing_ShiftDown_P1: Button26
  BG3_ShiftDown_P1: Button26
  Racing_ShiftUp_P1: Button25
  BG3_ShiftUp_P1: Button25
  Coin1: Button30
  P1_Start: Button45
