# This file is provided with RetroBat
# It can be used to automatically generate wheel mapping for TeknoParrot racing games
# Each container must be named with the wheel type internal to RetroBat (see Common/Wheels.cs WheelType enum)
# The key represents the TeknoParrot InputMapping
# The value represents the DirectInput code (BUTTON# or AXIS code)
# Use the LogitechG29 entry as example
#
# For axes, values are: XAXIS_POS, XAXIS_NEG, YAXIS_POS, YAXIS_NEG, ZAXIS_POS, ZAXIS_NEG, RZAXIS_POS, RZAXIS_NEG
# For buttons, values are: BUTTON1, BUTTON2, BUTTON3, etc. (1-based, corresponding to DirectInput button index)
# For POV/Hat, values are: POV1_UP, POV1_DOWN, POV1_LEFT, POV1_RIGHT, POV2_UP, etc.
#
# The ImportDirectInputButton method will translate these codes to proper DirectInputButton objects

